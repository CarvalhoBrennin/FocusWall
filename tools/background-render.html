<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Background Render</title>
  <style>
    :root {
      --bg-0: #10130f;
      --bg-1: #161a16;
      --light-strong: #f6f0e6;
      --taskbar-height: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 14% 16%, rgba(210, 134, 88, 0.2), transparent 24%),
        radial-gradient(circle at 86% 12%, rgba(108, 123, 89, 0.16), transparent 20%),
        radial-gradient(circle at 50% 120%, rgba(193, 155, 76, 0.1), transparent 26%),
        linear-gradient(145deg, var(--bg-0) 0%, var(--bg-1) 40%, #0d110d 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 48%, rgba(6, 8, 7, 0.45) 100%);
    }

    .background-orb,
    .background-grid,
    .background-noise {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .background-orb {
      border-radius: 50%;
      filter: blur(46px);
      opacity: 0.5;
    }

    .background-orb--left {
      inset: auto auto -10rem -8rem;
      width: 34rem;
      height: 34rem;
      background: radial-gradient(circle, rgba(210, 134, 88, 0.32), transparent 70%);
    }

    .background-orb--right {
      inset: -8rem -10rem auto auto;
      width: 28rem;
      height: 28rem;
      background: radial-gradient(circle, rgba(108, 123, 89, 0.3), transparent 70%);
    }

    .background-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.16;
      -webkit-mask-image: radial-gradient(circle at center, black 42%, transparent 94%);
      mask-image: radial-gradient(circle at center, black 42%, transparent 94%);
    }

    .background-noise {
      opacity: 0.07;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.14) 0.6px, transparent 0.8px),
        radial-gradient(circle at 70% 64%, rgba(255, 255, 255, 0.08) 0.6px, transparent 0.8px);
      background-size: 12px 12px, 18px 18px;
    }

    .grain-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.08;
      background-image:
        linear-gradient(0deg, transparent 0%, rgba(255, 255, 255, 0.04) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.02) 0,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 4px
        );
    }
  </style>
</head>
<body>
  <div class="background-orb background-orb--left" aria-hidden="true"></div>
  <div class="background-orb background-orb--right" aria-hidden="true"></div>
  <div class="background-grid" aria-hidden="true"></div>
  <div class="background-noise" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>
</body>
</html>
