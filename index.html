<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Dashboard desktop pessoal com relógio em tempo real, câmbio BRL e tarefas diárias.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  >
  <style>
    /* Font loading optimization */
    @font-face {
      font-family: 'Manrope';
      font-display: swap;
      src: local('Manrope'), local('Manrope-Regular');
    }
    @font-face {
      font-family: 'Space Grotesk';
      font-display: swap;
      src: local('Space Grotesk'), local('SpaceGrotesk-Regular');
    }
  </style>
  <title>Focus Dashboard</title>
</head>
<body>
  <div id="app">
    <noscript>Habilite JavaScript para usar o Focus Dashboard.</noscript>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var el = document.getElementById('app');
      if (el && !el.querySelector('pre')) {
        el.innerHTML = '<pre style="color:red;padding:2rem;">Erro: ' + (e.message || 'desconhecido') + '</pre>';
      }
    });
  </script>
</body>
</html>
