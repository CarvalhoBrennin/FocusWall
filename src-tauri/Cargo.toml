[package]
name = "focus-desktop-dashboard"
version = "0.1.0"
description = "Desktop dashboard pessoal em Tauri."
authors = ["carva"]
edition = "2021"

[lib]
name = "focus_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "rt", "rt-multi-thread", "io-util"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
open = "5"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
getrandom = "0.3"
sysinfo = "0.33"
regex = "1.12.4"
quick-xml = "=0.38.4"
url = "=2.5.8"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
unicode-normalization = "0.1"
rand = "0.9"

[features]
live-provider-tests = []

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.0"
wmi = "0.14"
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
# 3 em vez de "s": o backend faz parsing de RSS/JSON, redimensionamento de imagem
# e amostragem de métricas — trabalho onde otimizar para velocidade encurta o
# tempo de resposta do IPC. O custo é binário maior, que `lto` + `strip` já
# atenuam e que importa pouco num app desktop.
opt-level = 3
