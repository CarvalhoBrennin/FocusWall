[package]
name = "focus-desktop-dashboard"
version = "0.1.0"
description = "Desktop dashboard pessoal em Tauri."
authors = ["carva"]
edition = "2021"

[lib]
name = "focus_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
open = "5"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
getrandom = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
