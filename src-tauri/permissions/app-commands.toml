[[permission]]
identifier = "allow-app-commands"
description = "Allow Focus Dashboard custom invoke commands."
commands.allow = [
  "load_state",
  "save_state",
  "get_app_data_path",
  "get_launch_on_startup",
  "set_launch_on_startup",
  "sync_launch_on_startup",
  "get_available_monitors",
  "get_current_monitor",
  "move_to_monitor",
  "save_monitor_preference",
  "search_project_dirs",
  "pick_project_directory",
  "resolve_opencode_command",
  "validate_project_directory",
  "start_opencode_server",
  "stop_opencode_server",
  "list_opencode_sessions",
  "create_opencode_session",
  "get_opencode_messages",
  "send_opencode_prompt",
  "abort_opencode_session",
  "get_opencode_session_status",
  "get_opencode_diff",
  "get_opencode_file_status",
  "read_directory",
  "open_file",
  "get_desktop_path",
  "get_well_known_folders",
  "get_system_snapshot",
  "get_media_snapshot",
  "get_media_artwork",
  "media_toggle_playback",
  "media_skip_next",
  "media_skip_previous",
  "check_ollama_health",
  "ollama_chat_stream",
]
