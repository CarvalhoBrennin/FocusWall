<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="design_doc_mode" content="canvas">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070707; }
  body { font-family: "Manrope", sans-serif; }
</style>
</helmet>

<div style="display:flex; flex-wrap:wrap; gap:36px; padding:56px; background:#070707; align-items:flex-start;">

  <!-- ============ 1A — Combination: surface frame + wordmark ============ -->
  <section id="1a" style="position:relative; width:560px; background:#0A0A0A; border:1px solid rgba(75,70,70,0.28); display:flex; flex-direction:column;">
    <div style="position:absolute; top:14px; left:14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(101,99,99,0.9); border:1px solid rgba(75,70,70,0.4); padding:3px 8px;">1A · COMBINATION</div>

    <div style="padding:88px 48px 56px; display:flex; align-items:center; gap:26px; justify-content:center; background:#0A0A0A;">
      <!-- surface glyph: bezel frame with feature blocks -->
      <div style="width:66px; height:66px; border:2px solid #F1ECEC; padding:7px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:4px; flex:none;">
        <div style="background:#F1ECEC;"></div>
        <div style="background:rgba(241,236,236,0.32);"></div>
        <div style="background:rgba(241,236,236,0.32);"></div>
        <div style="background:#F1ECEC;"></div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="font-family:'Orbitron',sans-serif; font-weight:700; font-size:30px; letter-spacing:2px; color:#F1ECEC; line-height:1;">FOCUS<span style="color:rgba(183,177,177,0.62);">WALL</span></div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:3.5px; color:rgba(101,99,99,0.95);">PRODUCTIVITY SURFACE</div>
      </div>
    </div>

    <div style="display:flex; border-top:1px solid rgba(75,70,70,0.28);">
      <div style="flex:1; padding:26px; display:flex; align-items:center; justify-content:center; background:#0D0C0C;">
        <div style="width:52px; height:52px; border:2px solid #F1ECEC; padding:6px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:3px;">
          <div style="background:#F1ECEC;"></div><div style="background:rgba(241,236,236,0.32);"></div><div style="background:rgba(241,236,236,0.32);"></div><div style="background:#F1ECEC;"></div>
        </div>
      </div>
      <div style="flex:1; padding:26px; display:flex; align-items:center; justify-content:center; background:#F1ECEC;">
        <div style="width:52px; height:52px; border:2px solid #0A0A0A; padding:6px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:3px;">
          <div style="background:#0A0A0A;"></div><div style="background:rgba(10,10,10,0.32);"></div><div style="background:rgba(10,10,10,0.32);"></div><div style="background:#0A0A0A;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 1B — Monogram: FW as a wall of pillars ============ -->
  <section id="1b" style="position:relative; width:560px; background:#0A0A0A; border:1px solid rgba(75,70,70,0.28); display:flex; flex-direction:column;">
    <div style="position:absolute; top:14px; left:14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(101,99,99,0.9); border:1px solid rgba(75,70,70,0.4); padding:3px 8px;">1B · MONOGRAM</div>

    <div style="padding:80px 48px 52px; display:flex; flex-direction:column; align-items:center; gap:24px;">
      <!-- FW mark: a wall of bars -->
      <div style="display:flex; align-items:flex-end; gap:6px; height:96px;">
        <div style="width:11px; height:96px; background:#F1ECEC;"></div>
        <div style="width:11px; height:66px; background:rgba(241,236,236,0.5);"></div>
        <div style="width:11px; height:82px; background:#F1ECEC;"></div>
        <div style="width:26px;"></div>
        <div style="width:11px; height:96px; background:#F1ECEC;"></div>
        <div style="width:11px; height:44px; background:rgba(241,236,236,0.5);"></div>
        <div style="width:11px; height:70px; background:#F1ECEC;"></div>
        <div style="width:11px; height:44px; background:rgba(241,236,236,0.5);"></div>
        <div style="width:11px; height:96px; background:#F1ECEC;"></div>
      </div>
      <div style="font-family:'Orbitron',sans-serif; font-weight:600; font-size:19px; letter-spacing:6px; color:#F1ECEC;">FOCUSWALL</div>
    </div>

    <div style="display:flex; border-top:1px solid rgba(75,70,70,0.28);">
      <div style="flex:1; padding:24px; display:flex; align-items:center; justify-content:center; background:#0D0C0C;">
        <div style="display:flex; align-items:flex-end; gap:3px; height:44px;">
          <div style="width:5px; height:44px; background:#F1ECEC;"></div><div style="width:5px; height:30px; background:rgba(241,236,236,0.5);"></div><div style="width:5px; height:38px; background:#F1ECEC;"></div>
          <div style="width:11px;"></div>
          <div style="width:5px; height:44px; background:#F1ECEC;"></div><div style="width:5px; height:20px; background:rgba(241,236,236,0.5);"></div><div style="width:5px; height:32px; background:#F1ECEC;"></div><div style="width:5px; height:20px; background:rgba(241,236,236,0.5);"></div><div style="width:5px; height:44px; background:#F1ECEC;"></div>
        </div>
      </div>
      <div style="flex:1; padding:24px; display:flex; align-items:center; justify-content:center; background:#F1ECEC;">
        <div style="display:flex; align-items:flex-end; gap:3px; height:44px;">
          <div style="width:5px; height:44px; background:#0A0A0A;"></div><div style="width:5px; height:30px; background:rgba(10,10,10,0.42);"></div><div style="width:5px; height:38px; background:#0A0A0A;"></div>
          <div style="width:11px;"></div>
          <div style="width:5px; height:44px; background:#0A0A0A;"></div><div style="width:5px; height:20px; background:rgba(10,10,10,0.42);"></div><div style="width:5px; height:32px; background:#0A0A0A;"></div><div style="width:5px; height:20px; background:rgba(10,10,10,0.42);"></div><div style="width:5px; height:44px; background:#0A0A0A;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 1C — Focus reticle framing the word ============ -->
  <section id="1c" style="position:relative; width:560px; background:#0A0A0A; border:1px solid rgba(75,70,70,0.28); display:flex; flex-direction:column;">
    <div style="position:absolute; top:14px; left:14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(101,99,99,0.9); border:1px solid rgba(75,70,70,0.4); padding:3px 8px;">1C · FOCUS RETICLE</div>

    <div style="padding:92px 48px 64px; display:flex; align-items:center; justify-content:center;">
      <div style="position:relative; padding:26px 34px;">
        <!-- corner brackets -->
        <div style="position:absolute; top:0; left:0; width:20px; height:20px; border-top:2px solid #F1ECEC; border-left:2px solid #F1ECEC;"></div>
        <div style="position:absolute; top:0; right:0; width:20px; height:20px; border-top:2px solid #F1ECEC; border-right:2px solid #F1ECEC;"></div>
        <div style="position:absolute; bottom:0; left:0; width:20px; height:20px; border-bottom:2px solid #F1ECEC; border-left:2px solid #F1ECEC;"></div>
        <div style="position:absolute; bottom:0; right:0; width:20px; height:20px; border-bottom:2px solid #F1ECEC; border-right:2px solid #F1ECEC;"></div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
          <div style="font-family:'Orbitron',sans-serif; font-weight:800; font-size:34px; letter-spacing:3px; color:#F1ECEC; line-height:1;">FOCUS</div>
          <div style="width:100%; height:1px; background:rgba(75,70,70,0.5);"></div>
          <div style="font-family:'Orbitron',sans-serif; font-weight:500; font-size:34px; letter-spacing:9px; color:rgba(183,177,177,0.7); line-height:1;">WALL</div>
        </div>
      </div>
    </div>

    <div style="display:flex; border-top:1px solid rgba(75,70,70,0.28);">
      <div style="flex:1; padding:26px; display:flex; align-items:center; justify-content:center; background:#0D0C0C;">
        <div style="position:relative; width:52px; height:52px;">
          <div style="position:absolute; top:0; left:0; width:15px; height:15px; border-top:2px solid #F1ECEC; border-left:2px solid #F1ECEC;"></div>
          <div style="position:absolute; top:0; right:0; width:15px; height:15px; border-top:2px solid #F1ECEC; border-right:2px solid #F1ECEC;"></div>
          <div style="position:absolute; bottom:0; left:0; width:15px; height:15px; border-bottom:2px solid #F1ECEC; border-left:2px solid #F1ECEC;"></div>
          <div style="position:absolute; bottom:0; right:0; width:15px; height:15px; border-bottom:2px solid #F1ECEC; border-right:2px solid #F1ECEC;"></div>
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-weight:800; font-size:20px; color:#F1ECEC;">F</div>
        </div>
      </div>
      <div style="flex:1; padding:26px; display:flex; align-items:center; justify-content:center; background:#F1ECEC;">
        <div style="position:relative; width:52px; height:52px;">
          <div style="position:absolute; top:0; left:0; width:15px; height:15px; border-top:2px solid #0A0A0A; border-left:2px solid #0A0A0A;"></div>
          <div style="position:absolute; top:0; right:0; width:15px; height:15px; border-top:2px solid #0A0A0A; border-right:2px solid #0A0A0A;"></div>
          <div style="position:absolute; bottom:0; left:0; width:15px; height:15px; border-bottom:2px solid #0A0A0A; border-left:2px solid #0A0A0A;"></div>
          <div style="position:absolute; bottom:0; right:0; width:15px; height:15px; border-bottom:2px solid #0A0A0A; border-right:2px solid #0A0A0A;"></div>
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-weight:800; font-size:20px; color:#0A0A0A;">F</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 1D — Brick grid abstract mark ============ -->
  <section id="1d" style="position:relative; width:560px; background:#0A0A0A; border:1px solid rgba(75,70,70,0.28); display:flex; flex-direction:column;">
    <div style="position:absolute; top:14px; left:14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(101,99,99,0.9); border:1px solid rgba(75,70,70,0.4); padding:3px 8px;">1D · WALL GRID</div>

    <div style="padding:80px 48px 56px; display:flex; flex-direction:column; align-items:center; gap:26px;">
      <!-- 4x4 brick wall, one cell "in focus" -->
      <div style="display:grid; grid-template-columns:repeat(4,20px); grid-template-rows:repeat(4,20px); gap:5px;">
        <div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div>
        <div style="background:rgba(241,236,236,0.22);"></div><div style="background:#F1ECEC;"></div><div style="background:#F1ECEC;"></div><div style="background:rgba(241,236,236,0.22);"></div>
        <div style="background:rgba(241,236,236,0.22);"></div><div style="background:#F1ECEC;"></div><div style="background:#F1ECEC;"></div><div style="background:rgba(241,236,236,0.22);"></div>
        <div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
        <div style="font-family:'Orbitron',sans-serif; font-weight:700; font-size:24px; letter-spacing:4px; color:#F1ECEC;">FOCUSWALL</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:3px; color:rgba(101,99,99,0.95);">EVERYTHING IN FOCUS</div>
      </div>
    </div>

    <div style="display:flex; border-top:1px solid rgba(75,70,70,0.28);">
      <div style="flex:1; padding:24px; display:flex; align-items:center; justify-content:center; background:#0D0C0C;">
        <div style="display:grid; grid-template-columns:repeat(4,10px); grid-template-rows:repeat(4,10px); gap:3px;">
          <div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div>
          <div style="background:rgba(241,236,236,0.22);"></div><div style="background:#F1ECEC;"></div><div style="background:#F1ECEC;"></div><div style="background:rgba(241,236,236,0.22);"></div>
          <div style="background:rgba(241,236,236,0.22);"></div><div style="background:#F1ECEC;"></div><div style="background:#F1ECEC;"></div><div style="background:rgba(241,236,236,0.22);"></div>
          <div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div><div style="background:rgba(241,236,236,0.22);"></div>
        </div>
      </div>
      <div style="flex:1; padding:24px; display:flex; align-items:center; justify-content:center; background:#F1ECEC;">
        <div style="display:grid; grid-template-columns:repeat(4,10px); grid-template-rows:repeat(4,10px); gap:3px;">
          <div style="background:rgba(10,10,10,0.2);"></div><div style="background:rgba(10,10,10,0.2);"></div><div style="background:rgba(10,10,10,0.2);"></div><div style="background:rgba(10,10,10,0.2);"></div>
          <div style="background:rgba(10,10,10,0.2);"></div><div style="background:#0A0A0A;"></div><div style="background:#0A0A0A;"></div><div style="background:rgba(10,10,10,0.2);"></div>
          <div style="background:rgba(10,10,10,0.2);"></div><div style="background:#0A0A0A;"></div><div style="background:#0A0A0A;"></div><div style="background:rgba(10,10,10,0.2);"></div>
          <div style="background:rgba(10,10,10,0.2);"></div><div style="background:rgba(10,10,10,0.2);"></div><div style="background:rgba(10,10,10,0.2);"></div><div style="background:rgba(10,10,10,0.2);"></div>
        </div>
      </div>
    </div>
  </section>

</div>
</x-dc>
</body>
</html>
